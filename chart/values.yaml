# Default values for harbor-pack.
# This chart wraps the upstream Harbor chart (https://helm.goharbor.io) and adds
# Nebari integration: a NebariApp CR (routing + landing-page card + Keycloak SSO)
# and a post-install Job that switches Harbor into OIDC auth mode.

# =============================================================================
# Nebari Integration
# =============================================================================
# Creates a NebariApp CR that tells the nebari-operator how to route to Harbor,
# provision a Keycloak OIDC client, and show a landing-page card.
# Set enabled: true when deploying on a Nebari cluster.
nebariapp:
  enabled: false
  # hostname: harbor.nebari.example.com   # REQUIRED when enabled. Harbor's externalURL
  #                                         # and OIDC redirect are derived from this.
  # Emit a Namespace object labeled nebari.dev/managed=true. Leave false and label
  # the namespace out-of-band (kubectl label ns <ns> nebari.dev/managed=true) to
  # avoid Helm ownership conflicts with `--create-namespace`.
  manageNamespace: false
  service:
    name: ""      # Defaults to the upstream Harbor front service (harbor.expose.clusterIP.name).
    port: 80
  routing:
    routes:
      - pathPrefix: /
        pathType: PathPrefix
    tls:
      enabled: true
  auth:
    enabled: true
    provider: keycloak
    provisionClient: true
    # Harbor performs OIDC itself and CLI clients (docker/oras/helm) authenticate
    # with Basic auth (CLI secret / robot accounts) against Harbor's own token
    # endpoint. Gateway-enforced browser OAuth would break those flows, so this
    # MUST stay false. The operator still provisions the Keycloak client + Secret.
    enforceAtGateway: false
    # Harbor's OIDC callback path. The operator registers this on the Keycloak client.
    redirectURI: /c/oidc/callback
    # offline_access is required so Harbor can refresh tokens / mint CLI secrets.
    scopes:
      - openid
      - profile
      - email
      - offline_access
      - groups
    # groups: [harbor-users]   # Optional: restrict access to these Keycloak groups.
  landingPage:
    enabled: true
    displayName: Harbor
    description: Container image & OCI artifact registry with vulnerability scanning.
    # No built-in icon for Harbor; use the upstream logo URL.
    icon: https://goharbor.io/img/logos/harbor-icon-color.png
    category: Platform
    priority: 100
    healthCheck:
      enabled: true
      path: /api/v2.0/health
      port: 80
  gateway: public

# =============================================================================
# Harbor OIDC configuration Job
# =============================================================================
# Harbor stores its OIDC settings in its database (set via the config API), not
# via Helm values. This post-install/upgrade hook Job reads the operator-created
# OIDC Secret (<nebariapp-fullname>-oidc-client) and PUTs /api/v2.0/configurations
# to switch Harbor into oidc_auth mode. Rendered only when both this and
# nebariapp.auth.enabled are true.
oidcSetup:
  enabled: true
  image: curlimages/curl:8.11.0
  oidcName: keycloak
  groupsClaim: groups
  # adminGroup: harbor-admins   # Optional Keycloak group mapped to Harbor system admin.
  userClaim: preferred_username
  autoOnboard: true
  verifyCert: true
  # Who may create projects (Harbor's `project_creation_restriction` setting):
  #   adminonly - only Harbor system admins can create projects
  #   everyone  - any logged-in user can create projects (upstream Harbor default)
  #   ""        - do not manage the setting (the Job leaves Harbor's value alone)
  # This Job only runs on SSO installs, where autoOnboard means "everyone" is
  # every user who can log in to Keycloak - usually not who should be able to
  # create projects on a shared registry - so the pack defaults to adminonly.
  # Standalone installs never render this Job and keep Harbor's own default.
  projectCreationRestriction: adminonly
  # Extra editable Harbor system settings, merged into the same
  # PUT /api/v2.0/configurations call so they can be set without a chart change.
  # Keys are Harbor config API names and values keep their YAML type in the JSON
  # payload (numbers and booleans unquoted, strings quoted), e.g.:
  #   systemConfig:
  #     robot_name_prefix: "robot$"
  #     robot_token_duration: 30             # days
  #     audit_log_forward_endpoint: "syslog://logger:5140"
  # Settings with security implications keep their own explicit value above.
  # Keys this Job manages (auth_mode, oidc_*, project_creation_restriction) are
  # rejected here rather than silently overriding the chart - use the dedicated
  # option instead.
  systemConfig: {}
  # Harbor admin credentials. The upstream chart writes them to the core Secret;
  # leave these empty to read from that Secret (name/key computed by default), or
  # override to point at your own Secret.
  adminPasswordSecret: ""   # Defaults to "<harbor-fullname>-core".
  adminPasswordKey: HARBOR_ADMIN_PASSWORD

# =============================================================================
# Harbor project bootstrap Job
# =============================================================================
# Harbor never auto-creates projects, and projects (with their members, tag
# immutability rules and webhook policies) live in Harbor's database, not in
# Helm values. This
# post-install/upgrade hook Job applies the declarations below through Harbor's
# REST API after the OIDC Job (hook weight 10 vs 5). It is idempotent - a repeat
# `helm upgrade` changes nothing that already matches (projects, members and
# rules are created only when absent; an existing webhook policy is re-PUT with
# the declared state so endpoint/event edits propagate, never duplicated) - and
# works with nebariapp.enabled: false too.
bootstrap:
  enabled: false
  image: ""   # Defaults to oidcSetup.image (curl + /bin/sh is all it needs).
  projects: []
  # projects:
  #   - name: cogs
  #     public: false
  #     # Optional: map Keycloak groups (OIDC group members) to project roles.
  #     members:
  #       - group: cog-publishers
  #         role: developer      # projectAdmin | maintainer | developer | guest | limitedGuest
  #     # Optional: tag immutability rules for the project.
  #     immutableTags:
  #       - tagPattern: "sha-*"
  #         repoPattern: "**"

  # Project webhook policies, applied by the same Job after the projects above.
  # Each policy's `project` must be listed in `projects` or already exist.
  # Unlike the projects, webhooks are updated in place: an existing policy with
  # the same name is rewritten, so endpoint/event changes here reach Harbor on
  # the next `helm upgrade` without leaving a duplicate behind.
  webhooks: []
  # webhooks:
  #   - project: cogs
  #     name: collab-hub-cog-index
  #     endpoint: https://collab-hub.example.com/cogs/registry-events
  #     events: [PUSH_ARTIFACT, DELETE_ARTIFACT]
  #     payloadFormat: Default    # Default | CloudEvents
  #     # Optional: sent verbatim as the Authorization header. The value comes
  #     # only from this Secret, which must exist in the release namespace - it
  #     # is never read from values and is never logged. It must be printable:
  #     # a trailing CR/LF is stripped, any other control character is rejected.
  #     authHeader:
  #       secretName: harbor-webhook-cog-index
  #       secretKey: authorization
  #     skipCertVerify: false
  #     enabled: true             # false keeps the policy but stops delivery

# =============================================================================
# Harbor (upstream subchart) overrides
# =============================================================================
# Everything under `harbor:` is passed to the upstream Harbor chart.
# See https://github.com/goharbor/harbor-helm for the full values reference.
harbor:
  # Set to https://<nebariapp.hostname>. Required for correct token-service and
  # OIDC redirect URLs. See examples/nebari-values.yaml.
  externalURL: ""

  expose:
    # The Nebari gateway terminates TLS and routes to this ClusterIP service, so
    # Harbor should not manage its own ingress or TLS.
    type: clusterIP
    tls:
      enabled: false
    clusterIP:
      name: harbor
      ports:
        httpPort: 80

  # Do not commit a real password. Set via examples/secret at deploy time.
  harborAdminPassword: ""

  # --- Storage: bundled defaults (quick start) --------------------------------
  # Registry blobs, DB, redis, trivy cache, and job logs all use PVCs by default.
  persistence:
    enabled: true
    resourcePolicy: keep
    persistentVolumeClaim:
      registry:
        size: 50Gi
      jobservice:
        jobLog:
          size: 5Gi
      database:
        size: 5Gi
      redis:
        size: 5Gi
      trivy:
        size: 5Gi
    imageChartStorage:
      # Registry backend. Default filesystem (PVC above).
      # Toggle to object storage for production:
      #   type: s3
      #   s3:
      #     region: us-east-1
      #     bucket: harbor-registry
      #     accesskey: ...
      #     secretkey: ...
      #     regionendpoint: https://minio.example.com   # for MinIO/S3-compatible
      #     secure: true
      type: filesystem

  # --- Backing services: bundled by default -----------------------------------
  database:
    type: internal
    # Toggle to external managed Postgres for production:
    #   type: external
    #   external:
    #     host: postgres.example.com
    #     port: "5432"
    #     username: harbor
    #     password: ...
    #     coreDatabase: registry
    #     sslmode: require
  redis:
    type: internal
    # Toggle to external managed Redis for production:
    #   type: external
    #   external:
    #     addr: redis.example.com:6379
    #     password: ...

  # Vulnerability scanning on by default.
  trivy:
    enabled: true

  # Prometheus metrics for a ServiceMonitor.
  metrics:
    enabled: true

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
