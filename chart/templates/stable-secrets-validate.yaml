{{/*
  stableSecrets fan-out validation
  --------------------------------
  Renders no object. Its only job is to fail the render early, with the exact
  values block to paste, when `stableSecrets.enabled` is true but the seven
  upstream Harbor keys do not point at the two stable Secrets.

  Why validation instead of automatic fan-out: a parent chart can only influence
  a subchart through *values*, and values are resolved before templates run -
  there is no template-side way to write into `.Values.harbor` (and the upstream
  chart reads none of these through `global`, so globals do not help either).
  Setting the seven keys unconditionally in values.yaml is not an option either:
  they would point every default install at Secrets that do not exist. So the
  keys stay explicit, and this check makes a half-configured install impossible.
*/}}
{{- if .Values.stableSecrets.enabled }}
{{- include "harbor-pack.stable-secrets.validate" . }}
{{- end }}
