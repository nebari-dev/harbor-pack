{{/*
  Stable-secrets provisioning Job
  -------------------------------
  Creates the two Secrets that `stableSecrets` points the upstream chart at, but
  ONLY if they do not already exist - the Job's Role has no update/patch verb,
  so an existing Secret is physically untouchable. That is what makes the render
  deterministic: after the first sync the credentials live in the cluster, every
  subsequent render reads the same Secret names, and nothing re-keys.

  It is a pre-install/pre-upgrade hook (Argo CD PreSync) because core,
  jobservice and registry mount these Secrets at startup - a post-install job
  would be too late.

  Images (three stock, pinned images; no package installs, so the containers can
  keep a read-only root filesystem):
    * htpasswd  - httpd:2.4-alpine. Harbor's registry only accepts *bcrypt*
      htpasswd entries; `openssl passwd` cannot produce bcrypt and busybox
      `cryptpw` cannot either, so Apache's `htpasswd -B` is the one stock tool
      that can. This container also draws all the random material from
      /dev/urandom so the registry password and its hash are generated together.
    * openssl   - alpine/openssl. No kubectl image surveyed ships an `openssl`
      binary (alpine/k8s, dtzar/helm-kubectl and curlimages/curl all carry only
      libcrypto), so the token-signing key pair gets its own tiny container.
      The key is converted to PKCS#1 ("BEGIN RSA PRIVATE KEY") because Harbor
      loads it through libtrust, which rejects PKCS#8 PEM blocks.
    * apply     - curlimages/curl, already used by the OIDC Job. Talks to the
      Kubernetes API directly with the ServiceAccount token, which avoids
      pulling a ~250 MB kubectl image for two REST calls.
  The containers share an emptyDir; nothing is ever written to a log.
*/}}
{{- if and .Values.stableSecrets.enabled .Values.stableSecrets.provision }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "harbor-pack.stable-secrets.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-pack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
    "argocd.argoproj.io/sync-wave": "-5"
spec:
  backoffLimit: 3
  # Clean up automatically 10 minutes after completion (requires TTL controller).
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "harbor-pack.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "harbor-pack.stable-secrets.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Makes the shared emptyDir group-writable for the non-root uid above.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        # ----------------------------------------------------------------
        # 0. Refuse to re-key an existing install.
        # ----------------------------------------------------------------
        - name: preflight
          image: {{ .Values.stableSecrets.images.apiClient | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: INTERNAL_SECRET
              value: {{ .Values.stableSecrets.internalSecret | quote }}
            - name: CORE_SECRET
              value: {{ printf "%s-core" (include "harbor-pack.harbor-fullname" .) | quote }}
            - name: ALLOW_FRESH_ON_EXISTING
              value: {{ .Values.stableSecrets.allowFreshOnExisting | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # Turning stableSecrets on over a RUNNING install is a data-loss
              # trap: upstream drops secretKey from its core Secret as soon as
              # existingSecretSecretKey is set, so a freshly generated key would
              # replace the one that encrypts the robot-account and registry
              # credentials already in Harbor's database - they become
              # undecryptable. Detect that transition and stop before anything
              # is generated. See the README's "Migrating an existing install".

              SA=/var/run/secrets/kubernetes.io/serviceaccount
              API="https://kubernetes.default.svc"
              CACERT="$SA/ca.crt"
              TOKEN="$(cat "$SA/token")"
              NS="$(cat "$SA/namespace")"

              # $1 = Secret name, $2 = where to put the body (/dev/null to drop it)
              probe() {
                # ?pretty=false: kube-apiserver pretty-prints JSON for curl's
                # default User-Agent, which would break the single-line parsing
                # below; the query parameter overrides that heuristic.
                curl -s --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
                  --connect-timeout 10 --max-time 60 --retry 3 --retry-connrefused \
                  -o "$2" -w '%{http_code}' \
                  "$API/api/v1/namespaces/$NS/secrets/$1?pretty=false" || {
                  echo "Could not reach the Kubernetes API while checking Secret $1." >&2
                  exit 1
                }
              }

              code="$(probe "$INTERNAL_SECRET" /dev/null)"
              case "$code" in
                200)
                  echo "Secret $INTERNAL_SECRET already exists; credentials are already stable."
                  exit 0
                  ;;
                404) ;;
                *) echo "Unexpected HTTP $code reading Secret $INTERNAL_SECRET in $NS." >&2; exit 1 ;;
              esac

              code="$(probe "$CORE_SECRET" /work/core.json)"
              case "$code" in
                404)
                  echo "No $CORE_SECRET in $NS: fresh install, safe to generate."
                  exit 0
                  ;;
                200) ;;
                *) echo "Unexpected HTTP $code reading Secret $CORE_SECRET in $NS." >&2; exit 1 ;;
              esac

              # The core Secret carries a "secretKey" field only while Harbor is
              # running on chart-generated key material; upstream omits it once
              # existingSecretSecretKey is set. Its presence is therefore the
              # precise signal for "this install still owns its own key".
              # Look only inside the "data" block so a metadata annotation that
              # merely mentions secretKey cannot trigger a false refusal (the
              # data block holds flat base64 strings, so it contains no nested
              # braces and the sed capture is unambiguous). The body is first
              # normalized with tr so the check does not depend on the API
              # server's serialization (pretty=false is requested above, but a
              # pretty-printed body must fail CLOSED here, not open).
              # grep -q: the body is never printed, and it is deleted either way.
              if tr -d ' \t\r\n' < /work/core.json \
                   | sed -n 's/.*"data":{\([^}]*\)}.*/\1/p' | grep -q '"secretKey":'; then
                rm -f /work/core.json
                if [ "$ALLOW_FRESH_ON_EXISTING" = "true" ]; then
                  echo "WARNING: $CORE_SECRET still holds a chart-generated secretKey and" >&2
                  echo "WARNING: $INTERNAL_SECRET does not exist. Generating fresh credentials" >&2
                  echo "WARNING: anyway because stableSecrets.allowFreshOnExisting is true." >&2
                  echo "WARNING: Robot-account and registry credentials already stored in" >&2
                  echo "WARNING: Harbor's database will become undecryptable." >&2
                  exit 0
                fi
                echo "REFUSING to generate new credentials." >&2
                echo "" >&2
                echo "$CORE_SECRET exists and still holds a chart-generated secretKey, but" >&2
                echo "$INTERNAL_SECRET does not exist yet. Generating a new secretKey here would" >&2
                echo "replace the key that encrypts the robot-account and registry credentials" >&2
                echo "stored in Harbor's database, making them undecryptable." >&2
                echo "" >&2
                echo "Copy the existing key material into $INTERNAL_SECRET first - see" >&2
                echo "\"Migrating an existing install\" in the harbor-pack README - then re-run." >&2
                echo "" >&2
                echo "To generate fresh credentials anyway (ONLY on an install whose data you" >&2
                echo "are willing to lose), set stableSecrets.allowFreshOnExisting=true." >&2
                exit 1
              fi
              rm -f /work/core.json

              echo "$CORE_SECRET carries no chart-generated secretKey; safe to generate."
          volumeMounts:
            - name: work
              mountPath: /work
        # ----------------------------------------------------------------
        # 1. Random material + the bcrypt htpasswd line for the registry.
        # ----------------------------------------------------------------
        - name: generate-material
          image: {{ .Values.stableSecrets.images.htpasswd | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: REGISTRY_USERNAME
              value: {{ include "harbor-pack.stable-secrets.registry-username" . | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077

              # Alphanumeric only: these land in config files and env vars that
              # Harbor does not quote.
              rand() {
                tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c "$1"
              }

              # Lengths mirror what the upstream chart generates:
              #   secretKey / secret / JOBSERVICE_SECRET / REGISTRY_HTTP_SECRET = 16
              #   CSRF_KEY = 32 (harbor-core validates this one's length)
              rand 16 > /work/secretKey
              rand 16 > /work/secret
              rand 32 > /work/CSRF_KEY
              rand 16 > /work/JOBSERVICE_SECRET
              rand 16 > /work/REGISTRY_HTTP_SECRET
              rand 16 > /work/REGISTRY_PASSWD

              # The registry authenticates core/jobservice against this htpasswd
              # line, so the hash must cover the password written just above.
              # -B = bcrypt (the only algorithm the registry accepts), -C 10 to
              # match the cost the upstream chart's htpasswd helper uses.
              #
              # Captured into a variable rather than piped: in a pipeline `set -e`
              # only sees the LAST command's status, so `htpasswd | tr` would
              # swallow a rejected username (htpasswd refuses ':' and control
              # characters) and write an empty entry that locks the registry out
              # permanently. Global `pipefail` is not an option either - it would
              # make the SIGPIPE in rand()'s `tr | head` fatal.
              if [ -z "$REGISTRY_USERNAME" ]; then
                echo "harbor.registry.credentials.username is empty." >&2
                exit 1
              fi
              if ! htpasswd_line="$(htpasswd -nbB -C 10 "$REGISTRY_USERNAME" "$(cat /work/REGISTRY_PASSWD)")"; then
                echo "htpasswd failed for registry username '$REGISTRY_USERNAME'." >&2
                echo "Check harbor.registry.credentials.username: ':' and control characters are rejected." >&2
                exit 1
              fi
              case "$htpasswd_line" in
                "$REGISTRY_USERNAME:\$2"*) ;;
                *)
                  echo "htpasswd produced no usable bcrypt entry for '$REGISTRY_USERNAME'." >&2
                  exit 1
                  ;;
              esac
              # htpasswd does not reject a newline in the username, but the
              # registry cannot parse a multi-line entry.
              if [ "$(printf '%s\n' "$htpasswd_line" | wc -l)" -ne 1 ]; then
                echo "htpasswd entry is not a single line; check harbor.registry.credentials.username." >&2
                exit 1
              fi
              # Command substitution already dropped the trailing newline, which
              # is what upstream's htpasswd helper emits too.
              printf '%s' "$htpasswd_line" > /work/REGISTRY_HTPASSWD
              {{- if .Values.stableSecrets.adminPassword.enabled }}

              rand 24 > /work/adminPassword
              {{- end }}

              echo "Generated internal credential material (values not logged)."
          volumeMounts:
            - name: work
              mountPath: /work
        # ----------------------------------------------------------------
        # 2. Self-signed token-signing key pair (upstream uses genCA here).
        # ----------------------------------------------------------------
        - name: generate-token-cert
          image: {{ .Values.stableSecrets.images.openssl | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077

              # 2>/dev/null only silences openssl's progress dots.
              openssl req -x509 -newkey rsa:4096 -nodes -sha256 \
                -days {{ .Values.stableSecrets.tokenCertDays }} \
                -subj "/CN=harbor-token-ca" \
                -addext "basicConstraints=critical,CA:TRUE" \
                -keyout /work/tls.key.pkcs8 -out /work/tls.crt 2>/dev/null

              # Harbor loads the token key through libtrust, which only parses
              # PKCS#1 ("RSA PRIVATE KEY"); OpenSSL 3 emits PKCS#8 by default.
              openssl rsa -traditional -in /work/tls.key.pkcs8 -out /work/tls.key 2>/dev/null
              rm -f /work/tls.key.pkcs8

              echo "Generated token-signing key pair (valid {{ .Values.stableSecrets.tokenCertDays }} days)."
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        # ----------------------------------------------------------------
        # 3. Create the Secrets through the Kubernetes API, if absent.
        # ----------------------------------------------------------------
        - name: apply
          image: {{ .Values.stableSecrets.images.apiClient | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: INTERNAL_SECRET
              value: {{ .Values.stableSecrets.internalSecret | quote }}
            - name: TOKEN_SIGNING_SECRET
              value: {{ .Values.stableSecrets.tokenSigningSecret | quote }}
            {{- if .Values.stableSecrets.adminPassword.enabled }}
            - name: ADMIN_SECRET
              value: {{ .Values.stableSecrets.adminPassword.secretName | quote }}
            - name: ADMIN_SECRET_KEY
              value: {{ .Values.stableSecrets.adminPassword.key | quote }}
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              SA=/var/run/secrets/kubernetes.io/serviceaccount
              API="https://kubernetes.default.svc"
              CACERT="$SA/ca.crt"
              TOKEN="$(cat "$SA/token")"
              NS="$(cat "$SA/namespace")"

              # Deliberately NOT app.kubernetes.io/instance: Argo CD's default
              # resource tracking is by that label, and these Secrets are created
              # outside the rendered manifest - claiming them would invite a prune.
              LABELS='"app.kubernetes.io/name":"harbor-pack","app.kubernetes.io/component":"stable-secrets","app.kubernetes.io/managed-by":"harbor-pack-stable-secrets"'

              api() {
                curl -s --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
                  --connect-timeout 10 --max-time 60 --retry 3 --retry-connrefused "$@"
              }

              # base64 of a file, unwrapped. Values never reach stdout.
              b64() {
                base64 < "/work/$1" | tr -d '\n'
              }

              entry() {
                printf '"%s":"%s"' "$1" "$(b64 "$1")"
              }

              exists() {
                code="$(api -o /dev/null -w '%{http_code}' \
                  "$API/api/v1/namespaces/$NS/secrets/$1")" || {
                  echo "Could not reach the Kubernetes API while checking Secret $1." >&2
                  exit 1
                }
                case "$code" in
                  200) return 0 ;;
                  404) return 1 ;;
                  # 403 usually means the hook's Role/RoleBinding did not land first.
                  *) echo "Unexpected HTTP $code reading Secret $1 in $NS." >&2; exit 1 ;;
                esac
              }

              # create <name> <type> <json-data-pairs>
              create() {
                name="$1"; type="$2"; data="$3"

                if exists "$name"; then
                  echo "Secret $name already exists in $NS; leaving it untouched."
                  return 0
                fi

                # Piped on stdin, never passed as an argument, so no credential
                # material ever appears in the process table.
                code="$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","namespace":"%s","labels":{%s}},"type":"%s","data":{%s}}' \
                    "$name" "$NS" "$LABELS" "$type" "$data" \
                  | api -o /work/resp.json -w '%{http_code}' \
                      -X POST -H "Content-Type: application/json" \
                      --data-binary @- "$API/api/v1/namespaces/$NS/secrets")" || {
                  echo "Could not reach the Kubernetes API while creating Secret $name." >&2
                  exit 1
                }

                case "$code" in
                  200|201)
                    echo "Created Secret $name in $NS."
                    ;;
                  409)
                    echo "Secret $name was created concurrently; leaving it untouched."
                    ;;
                  *)
                    # Print only the API's message field - never the response body,
                    # which could echo back what we sent. Whitespace-tolerant in
                    # case the response arrives pretty-printed; >&2 comes before
                    # 2>/dev/null so the match reaches the real stderr.
                    echo "Failed to create Secret $name (HTTP $code):" >&2
                    grep -Eo '"message"[[:space:]]*:[[:space:]]*"[^"]*"' /work/resp.json >&2 2>/dev/null || true
                    exit 1
                    ;;
                esac
                rm -f /work/resp.json
              }

              create "$INTERNAL_SECRET" "Opaque" \
                "$(entry secretKey),$(entry secret),$(entry CSRF_KEY),$(entry JOBSERVICE_SECRET),$(entry REGISTRY_HTTP_SECRET),$(entry REGISTRY_PASSWD),$(entry REGISTRY_HTPASSWD)"

              create "$TOKEN_SIGNING_SECRET" "kubernetes.io/tls" \
                "$(entry tls.crt),$(entry tls.key)"
              {{- if .Values.stableSecrets.adminPassword.enabled }}

              create "$ADMIN_SECRET" "Opaque" \
                "$(printf '"%s":"%s"' "$ADMIN_SECRET_KEY" "$(b64 adminPassword)")"
              {{- end }}

              echo "Stable secrets are in place."
          volumeMounts:
            - name: work
              mountPath: /work
{{- end }}
