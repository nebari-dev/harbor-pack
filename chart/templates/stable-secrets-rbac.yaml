{{/*
  RBAC for the stable-secrets provisioning Job
  --------------------------------------------
  A dedicated ServiceAccount plus a namespace-scoped Role granting only `get`
  (does the Secret already exist?) and `create` (make it if not) on Secrets. No
  update/patch/delete: an existing Secret can never be overwritten by this Job,
  by construction rather than by convention.

  Rendered as pre-install/pre-upgrade (Argo CD PreSync) hooks at a lower weight
  than the Job so they exist before it runs, and independently of nebariapp -
  the Job must work in standalone mode too.
*/}}
{{- if and .Values.stableSecrets.enabled .Values.stableSecrets.provision }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harbor-pack.stable-secrets.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-pack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
    "argocd.argoproj.io/sync-wave": "-10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "harbor-pack.stable-secrets.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-pack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
    "argocd.argoproj.io/sync-wave": "-10"
rules:
  # `create` cannot be restricted by resourceNames (the name is not known to the
  # authorizer until the object is submitted), so it is granted broadly - but the
  # Job only ever creates the names below, and it can never update or delete.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # `get` is narrowed to exactly the Secrets the Job inspects: the ones it may
  # create, plus the upstream core Secret it reads to detect an unsafe
  # enable-on-existing-install transition.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - {{ .Values.stableSecrets.internalSecret | quote }}
      - {{ .Values.stableSecrets.tokenSigningSecret | quote }}
      {{- if .Values.stableSecrets.adminPassword.enabled }}
      - {{ .Values.stableSecrets.adminPassword.secretName | quote }}
      {{- end }}
      - {{ printf "%s-core" (include "harbor-pack.harbor-fullname" .) | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "harbor-pack.stable-secrets.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-pack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
    "argocd.argoproj.io/sync-wave": "-9"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "harbor-pack.stable-secrets.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harbor-pack.stable-secrets.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
