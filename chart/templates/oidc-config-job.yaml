{{/*
  Harbor OIDC configuration Job
  -----------------------------
  Harbor stores its auth/OIDC settings in its database and exposes them through
  the config API (PUT /api/v2.0/configurations) - they are NOT settable via Helm
  values. This post-install/upgrade hook reads the OIDC client credentials the
  nebari-operator provisioned into <nebariapp-fullname>-oidc-client and switches
  Harbor into oidc_auth mode pointing at Keycloak.

  The same call also carries general system settings: the explicit
  oidcSetup.projectCreationRestriction option plus anything in
  oidcSetup.systemConfig. Those are assembled into one JSON fragment at template
  time (SYSTEM_CONFIG_JSON below) so each value keeps its YAML type - the config
  image has no jq to build JSON at runtime.

  Rendered only when Nebari auth AND oidcSetup are enabled. The Job runs as the
  NebariApp's ServiceAccount (same name as the NebariApp), which the operator
  grants read access to the OIDC Secret.
*/}}
{{- /*
  Validate unconditionally so mistakes fail the render rather than the Job.
  Check the raw value before defaulting: `default` turns YAML false/0 into "",
  which would silently mean "leave the setting unmanaged".
*/}}
{{- $rawRestriction := .Values.oidcSetup.projectCreationRestriction }}
{{- if and (not (kindIs "invalid" $rawRestriction)) (not (kindIs "string" $rawRestriction)) }}
{{- fail (printf "oidcSetup.projectCreationRestriction must be a string (\"adminonly\", \"everyone\", or \"\"); got %v of type %s" $rawRestriction (kindOf $rawRestriction)) }}
{{- end }}
{{- $restriction := $rawRestriction | default "" }}
{{- if not (has $restriction (list "" "adminonly" "everyone")) }}
{{- fail (printf "oidcSetup.projectCreationRestriction must be \"adminonly\", \"everyone\", or \"\" (leave Harbor's current setting); got %q" $restriction) }}
{{- end }}
{{- /*
  Keys this Job owns. The systemConfig fragment is appended after them in the
  payload, so a duplicate would win over the chart-managed value (JSON decoders
  take the last occurrence). Reject them by name instead of dropping silently.
*/}}
{{- $reservedKeys := list "auth_mode" "oidc_name" "oidc_endpoint" "oidc_client_id" "oidc_client_secret" "oidc_scope" "oidc_groups_claim" "oidc_admin_group" "oidc_user_claim" "oidc_auto_onboard" "oidc_verify_cert" "project_creation_restriction" }}
{{- range $key, $value := (.Values.oidcSetup.systemConfig | default dict) }}
{{- if has $key $reservedKeys }}
{{- fail (printf "oidcSetup.systemConfig may not set %q: it is managed by the OIDC config Job. Use the dedicated oidcSetup option (e.g. oidcSetup.projectCreationRestriction) instead." $key) }}
{{- end }}
{{- end }}

{{- if and .Values.nebariapp.enabled .Values.nebariapp.auth.enabled .Values.oidcSetup.enabled }}
{{- /*
  Assemble the system-settings fragment: oidcSetup.systemConfig plus the
  explicit options. Pairs are rendered with toJson so numbers and booleans stay
  unquoted and strings are quoted/escaped correctly. The result is appended to
  the payload object, hence the leading comma.

  "$" is doubled because Kubernetes expands $(VAR) references inside env value
  fields; it collapses "$$" back to a single "$" before the container sees it.
*/}}
{{- $systemConfig := merge (dict) (.Values.oidcSetup.systemConfig | default dict) }}
{{- if $restriction }}
{{-   $_ := set $systemConfig "project_creation_restriction" $restriction }}
{{- end }}
{{- $pairs := list }}
{{- range $key, $value := $systemConfig }}
{{-   $pairs = append $pairs (printf "%s: %s" (toJson $key) (toJson $value)) }}
{{- end }}
{{- $systemConfigJSON := "" }}
{{- if $pairs }}
{{-   $systemConfigJSON = printf ",%s" (join "," $pairs) | replace "$" "$$" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "harbor-pack.fullname" . }}-oidc-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-pack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  # Clean up automatically 10 minutes after completion (requires TTL controller).
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "harbor-pack.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "harbor-pack.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: configure-oidc
          image: {{ .Values.oidcSetup.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HARBOR_API
              value: "http://{{ include "harbor-pack.harbor-service-name" . }}:{{ include "harbor-pack.harbor-service-port" . }}/api/v2.0"
            - name: OIDC_NAME
              value: {{ .Values.oidcSetup.oidcName | quote }}
            - name: OIDC_SCOPE
              value: {{ .Values.nebariapp.auth.scopes | join "," | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ .Values.oidcSetup.groupsClaim | quote }}
            - name: OIDC_ADMIN_GROUP
              value: {{ .Values.oidcSetup.adminGroup | default "" | quote }}
            - name: OIDC_USER_CLAIM
              value: {{ .Values.oidcSetup.userClaim | quote }}
            - name: OIDC_AUTO_ONBOARD
              value: {{ .Values.oidcSetup.autoOnboard | quote }}
            - name: OIDC_VERIFY_CERT
              value: {{ .Values.oidcSetup.verifyCert | quote }}
            # Pre-rendered JSON fragment (leading comma, or empty) appended to the
            # configuration payload: project_creation_restriction + systemConfig.
            - name: SYSTEM_CONFIG_JSON
              value: {{ $systemConfigJSON | quote }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "harbor-pack.oidc-secret-name" . }}
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "harbor-pack.oidc-secret-name" . }}
                  key: client-secret
            - name: OIDC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "harbor-pack.oidc-secret-name" . }}
                  key: issuer-url
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "harbor-pack.admin-secret-name" . }}
                  key: {{ include "harbor-pack.admin-secret-key" . | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "Waiting for Harbor API at ${HARBOR_API} ..."
              i=0
              until curl -sf -o /dev/null "${HARBOR_API}/health"; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "Harbor API not healthy after ~5m; giving up." >&2
                  exit 1
                fi
                sleep 5
              done
              echo "Harbor API is healthy."

              # Build the configuration payload. jq is not present in curl images,
              # so assemble JSON by hand with printf (values come from Keycloak /
              # the operator Secret and contain no embedded quotes).
              # SYSTEM_CONFIG_JSON was rendered by Helm and is either empty or a
              # comma-prefixed list of already-typed "key": value pairs.
              PAYLOAD=$(printf '{
                "auth_mode": "oidc_auth",
                "oidc_name": "%s",
                "oidc_endpoint": "%s",
                "oidc_client_id": "%s",
                "oidc_client_secret": "%s",
                "oidc_scope": "%s",
                "oidc_groups_claim": "%s",
                "oidc_admin_group": "%s",
                "oidc_user_claim": "%s",
                "oidc_auto_onboard": %s,
                "oidc_verify_cert": %s%s
              }' "$OIDC_NAME" "$OIDC_ENDPOINT" "$OIDC_CLIENT_ID" "$OIDC_CLIENT_SECRET" \
                 "$OIDC_SCOPE" "$OIDC_GROUPS_CLAIM" "$OIDC_ADMIN_GROUP" "$OIDC_USER_CLAIM" \
                 "$OIDC_AUTO_ONBOARD" "$OIDC_VERIFY_CERT" "$SYSTEM_CONFIG_JSON")

              echo "Configuring Harbor OIDC (endpoint: ${OIDC_ENDPOINT}) ..."
              STATUS=$(curl -s -o /tmp/resp.txt -w '%{http_code}' \
                -X PUT "${HARBOR_API}/configurations" \
                -u "admin:${HARBOR_ADMIN_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")

              if [ "$STATUS" != "200" ]; then
                echo "Failed to configure OIDC (HTTP ${STATUS}):" >&2
                cat /tmp/resp.txt >&2
                exit 1
              fi
              echo "Harbor OIDC configuration applied successfully."
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
