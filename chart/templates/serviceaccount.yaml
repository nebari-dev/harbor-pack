{{/*
  ServiceAccount for the NebariApp / OIDC-setup Job.
  The nebari-operator scopes a Role granting read access to the provisioned OIDC
  client Secret to the ServiceAccount named in NebariApp.spec.serviceAccountName.
  We create that SA here and reference it from both the NebariApp and the Job so
  the Job can read <fullname>-oidc-client.
*/}}
{{- if .Values.nebariapp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harbor-pack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-pack.labels" . | nindent 4 }}
{{- end }}
