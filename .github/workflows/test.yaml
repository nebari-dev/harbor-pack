name: Test (standalone)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: harbor-test

      - name: Install Helm
        # The version AND its sha256 are pinned here, rather than trusting a
        # checksum fetched alongside the tarball from the same server, so a
        # changed download fails CI instead of changing what CI runs (#22).
        # On upgrade, take the linux-amd64 sha256 from the release notes at
        # https://github.com/helm/helm/releases and update both lines together.
        run: |
          set -euo pipefail
          version=v4.3.1
          sha256=0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          curl -sSLo helm.tar.gz "https://get.helm.sh/helm-${version}-linux-amd64.tar.gz"
          echo "${sha256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version --short

      - name: Update chart dependencies
        run: helm dependency update chart/

      # Standalone install: no nebari-operator/Keycloak required. Uses bundled
      # Postgres/Redis and filesystem registry storage.
      - name: Install harbor-pack (NebariApp disabled)
        run: |
          helm install harbor chart/ \
            --create-namespace --namespace harbor \
            -f examples/standalone-values.yaml \
            --wait --timeout 10m

      - name: Wait for Harbor core
        run: |
          kubectl rollout status deploy/harbor-core -n harbor --timeout=300s

      - name: Health check Harbor API
        run: |
          kubectl port-forward -n harbor svc/harbor 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/api/v2.0/health
          kill %1

      - name: Confirm no NebariApp / OIDC Job rendered standalone
        run: |
          ! kubectl get job harbor-harbor-pack-oidc-setup -n harbor 2>/dev/null

      - name: Uninstall
        if: always()
        run: helm uninstall harbor -n harbor --wait || true
