name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | \
            sudo tar -xz -C /usr/local/bin kubeconform

      - name: Update chart dependencies
        run: helm dependency update chart/

      - name: helm lint
        run: helm lint chart/ --set nebariapp.hostname=harbor.example.com --set harbor.externalURL=https://harbor.example.com --set harbor.harborAdminPassword=ci

      - name: Template (NebariApp disabled)
        run: |
          helm template harbor chart/ \
            --set nebariapp.enabled=false \
            --set harbor.harborAdminPassword=ci \
            > /tmp/standalone.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/standalone.yaml

      - name: Template (NebariApp enabled)
        run: |
          helm template harbor chart/ \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=harbor.example.com \
            --set harbor.externalURL=https://harbor.example.com \
            --set harbor.harborAdminPassword=ci \
            > /tmp/nebari.yaml
          # -ignore-missing-schemas: NebariApp CRD schema is not bundled.
          kubeconform -strict -ignore-missing-schemas -summary /tmp/nebari.yaml

      - name: Template (GitOps stable secrets)
        run: |
          helm template harbor chart/ -f examples/gitops-values.yaml > /tmp/gitops-1.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/gitops-1.yaml

      - name: Render is deterministic with stableSecrets
        run: |
          # The regression this guards: the upstream Harbor chart mints the core,
          # jobservice and registry secrets plus the token-signing key pair at
          # RENDER time, so under a GitOps controller (which renders without
          # cluster access) every sync re-keys four Secrets and rolls three
          # Deployments. With stableSecrets configured nothing is generated at
          # render time, so two runs of identical values must be byte-identical.
          # Nothing is excluded from the comparison - the provisioning hook Job
          # generates its material at RUN time, not at render time.
          helm template harbor chart/ -f examples/gitops-values.yaml > /tmp/gitops-2.yaml
          if ! cmp -s /tmp/gitops-1.yaml /tmp/gitops-2.yaml; then
            diff -u /tmp/gitops-1.yaml /tmp/gitops-2.yaml || true
            echo "::error::helm template is not deterministic with stableSecrets configured"
            exit 1
          fi
          echo "Two renders with identical values are byte-identical."

      - name: stableSecrets without the fan-out fails the render
        run: |
          # The seven upstream keys cannot be set from a parent template, so the
          # chart must refuse to render a half-configured install rather than
          # quietly keep generating credentials.
          if helm template harbor chart/ \
               --set stableSecrets.enabled=true \
               --set harbor.harborAdminPassword=ci > /tmp/unguarded.yaml 2>/tmp/unguarded.err; then
            echo "::error::expected the render to fail when stableSecrets.enabled is set without the harbor.* fan-out"
            exit 1
          fi
          grep -q "existingSecretSecretKey" /tmp/unguarded.err
          echo "Render failed as expected with the fan-out block in the message."

      - name: stableSecrets with a renamed key selector fails the render
        run: |
          # The provisioning Job writes the default key names, so renaming one of
          # upstream's key selectors would point the pods at a key that is not in
          # the Secret.
          if helm template harbor chart/ -f examples/gitops-values.yaml \
               --set harbor.jobservice.existingSecretKey=RENAMED \
               > /dev/null 2>/tmp/renamed.err; then
            echo "::error::expected the render to fail when a key selector is renamed"
            exit 1
          fi
          grep -q "JOBSERVICE_SECRET" /tmp/renamed.err
          echo "Render failed as expected."

      - name: Template (bootstrap enabled)
        run: |
          # Without harbor.externalURL: exercises the in-cluster registry-host
          # fallback the robot Secrets fall back to.
          helm template harbor chart/ \
            --set nebariapp.enabled=false \
            --set harbor.harborAdminPassword=ci \
            -f examples/bootstrap-values.yaml \
            > /tmp/bootstrap.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/bootstrap.yaml
          # With harbor.externalURL: the normal case, where robot Secrets record
          # the public registry host.
          helm template harbor chart/ \
            --set nebariapp.enabled=false \
            --set harbor.harborAdminPassword=ci \
            --set harbor.externalURL=https://harbor.example.com \
            -f examples/bootstrap-values.yaml \
            > /tmp/bootstrap-external.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/bootstrap-external.yaml

      - name: Validate pack-metadata.yaml
        run: |
          pip install check-jsonschema
          check-jsonschema \
            --schemafile https://raw.githubusercontent.com/nebari-dev/software-pack-dashboard/main/schema/pack-metadata.schema.json \
            pack-metadata.yaml
