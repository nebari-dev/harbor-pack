# Declarative Harbor projects, webhook policies and robot accounts, applied by
# the post-install bootstrap Jobs.
#
#   helm install harbor . -n harbor --create-namespace \
#     -f standalone-values.yaml -f bootstrap-values.yaml
#
# The Jobs are idempotent: existing projects, members, rules and robots are left
# alone, so re-running `helm upgrade` changes nothing. Members map Keycloak
# (OIDC) groups to Harbor project roles and therefore need OIDC auth configured.

bootstrap:
  enabled: true
  projects:
    - name: cogs
      public: false
      members:
        - group: cog-publishers
          role: developer      # projectAdmin | maintainer | developer | guest | limitedGuest
        - group: cog-readers
          role: guest
      immutableTags:
        - tagPattern: "sha-*"
          repoPattern: "**"
    - name: shared
      public: true

  # Webhook policies are matched by (project, name) and rewritten in place, so
  # editing `endpoint` or `events` below and re-running `helm upgrade` updates
  # the existing policy rather than adding a second one.
  #
  # The `authHeader` Secret must already exist in the release namespace, e.g.
  #
  #   kubectl create secret generic harbor-webhook-cog-index -n harbor \
  #     --from-literal=authorization="Bearer $(cat token)"
  webhooks:
    - project: cogs
      name: collab-hub-cog-index
      endpoint: https://collab-hub.example.com/cogs/registry-events
      events: [PUSH_ARTIFACT, DELETE_ARTIFACT]
      payloadFormat: Default     # Default | CloudEvents
      authHeader:                # sent verbatim as the Authorization header
        secretName: harbor-webhook-cog-index
        secretKey: authorization
      skipCertVerify: false
      enabled: true
    # No authHeader: the endpoint is unauthenticated (or authenticates by URL).
    - project: shared
      name: scan-results
      endpoint: https://hooks.example.com/harbor/scans
      events: [SCANNING_COMPLETED, SCANNING_FAILED]

  # Robot accounts. Each one's credential lands in a Kubernetes Secret with the
  # keys username / password / registry - the only moment Harbor ever reveals a
  # robot secret is its create response, so the Job captures it there.
  robots:
    # Read-only indexer for the `cogs` project (the default permission set is
    # repository:list, repository:pull, artifact:read, artifact:list, tag:list).
    - name: hub-cog-indexer
      level: project
      project: cogs
      duration: -1             # never expires; do not rely on Harbor's 30-day default
      permissions: []
      secret:
        name: harbor-robot-hub-cog-indexer
        namespace: ""          # defaults to the release namespace
    # A publisher for CI: an explicit list replaces the default entirely.
    - name: shared-publisher
      level: project
      project: shared
      duration: 365
      permissions:
        - resource: repository
          action: pull
        - resource: repository
          action: push
        - resource: artifact
          action: read
        - resource: tag
          action: create
      secret:
        name: harbor-robot-shared-publisher
